<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#176b5f">
  <title>校园超市账本</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">进货 / 营业 / 结款</p>
        <h1>校园超市账本</h1>
      </div>
      <button id="exportBackupBtn" class="icon-btn" title="导出完整备份">备份</button>
    </header>

    <main>
      <section id="viewHome" class="view is-active">
        <div class="summary-grid">
          <article class="metric">
            <span>未结金额</span>
            <strong id="homeUnpaid">¥0.00</strong>
          </article>
          <article class="metric danger">
            <span>压单金额</span>
            <strong id="homeHeld">¥0.00</strong>
          </article>
          <article class="metric">
            <span>本月营业额</span>
            <strong id="homeRevenue">¥0.00</strong>
          </article>
          <article class="metric">
            <span>本月预计利润</span>
            <strong id="homeProfit">¥0.00</strong>
          </article>
        </div>
        <div id="todayStrip" class="today-strip"></div>

        <div class="section-head">
          <h2>进货登记</h2>
        </div>
        <form id="purchaseForm" class="form-panel">
          <label>
            <span>送货方</span>
            <input id="supplierInput" type="text" list="supplierOptions" placeholder="例如：旺旺食品 / 张三饮料" autocomplete="off" required>
            <datalist id="supplierOptions"></datalist>
          </label>
          <div class="two-col">
            <label>
              <span>金额</span>
              <input id="purchaseAmountInput" type="number" min="0.01" step="0.01" inputmode="decimal" placeholder="0.00" required>
            </label>
            <label>
              <span>日期</span>
              <input id="purchaseDateInput" type="date" required>
            </label>
          </div>
          <fieldset>
            <legend>状态</legend>
            <div class="segmented">
              <label><input type="radio" name="status" value="paid" checked><span>已结</span></label>
              <label><input type="radio" name="status" value="unpaid"><span>未结</span></label>
              <label><input type="radio" name="status" value="held"><span>压单</span></label>
            </div>
          </fieldset>
          <label>
            <span>单据照片</span>
            <input id="receiptInput" type="file" accept="image/*" capture="environment">
            <small>拍照会自动压缩保存，避免手机本地存储太快占满。</small>
          </label>
          <label>
            <span>备注</span>
            <textarea id="purchaseNoteInput" rows="2" placeholder="可选，例如：饮料、零食、日用品"></textarea>
          </label>
          <button class="primary-btn" type="submit">保存进货记录</button>
        </form>

        <div class="section-head">
          <h2>营业额登记</h2>
        </div>
        <form id="revenueForm" class="form-panel">
          <div class="two-col">
            <label>
              <span>营业额</span>
              <input id="revenueAmountInput" type="number" min="0.01" step="0.01" inputmode="decimal" placeholder="0.00" required>
            </label>
            <label>
              <span>日期</span>
              <input id="revenueDateInput" type="date" required>
            </label>
          </div>
          <label>
            <span>备注</span>
            <textarea id="revenueNoteInput" rows="2" placeholder="可选"></textarea>
          </label>
          <button class="primary-btn" type="submit">保存营业额</button>
        </form>
      </section>

      <section id="viewRecords" class="view">
        <div class="section-head">
          <h2>送货记录</h2>
          <div class="head-actions">
            <button id="todayFilterBtn" class="text-btn" type="button">今日</button>
            <button id="clearFiltersBtn" class="text-btn" type="button">清空</button>
          </div>
        </div>
        <div class="filter-panel">
          <input id="searchInput" type="search" placeholder="搜索送货方名字">
          <input id="dateFilterInput" type="date">
          <select id="statusFilterInput">
            <option value="">全部状态</option>
            <option value="paid">已结</option>
            <option value="unpaid">未结</option>
            <option value="held">压单</option>
          </select>
        </div>
        <div id="daySummary" class="day-summary"></div>
        <div id="recordsList" class="record-list"></div>
      </section>

      <section id="viewStats" class="view">
        <div class="section-head">
          <h2>统计</h2>
          <select id="statsRangeInput">
            <option value="week">本周</option>
            <option value="month" selected>本月</option>
            <option value="year">本年</option>
          </select>
        </div>
        <div class="summary-grid">
          <article class="metric">
            <span>总营业额</span>
            <strong id="statsRevenue">¥0.00</strong>
          </article>
          <article class="metric">
            <span>总送货金额</span>
            <strong id="statsPurchases">¥0.00</strong>
          </article>
          <article class="metric">
            <span>利润</span>
            <strong id="statsProfit">¥0.00</strong>
          </article>
          <article class="metric danger">
            <span>待处理</span>
            <strong id="statsPending">¥0.00</strong>
          </article>
        </div>

        <div class="section-head">
          <h2>未结</h2>
        </div>
        <div id="unpaidList" class="compact-list"></div>

        <div class="section-head">
          <h2>压单</h2>
        </div>
        <div id="heldList" class="compact-list"></div>

        <div class="section-head">
          <h2>导出</h2>
        </div>
        <div class="form-panel">
          <label>
            <span>导出月份</span>
            <input id="exportMonthInput" type="month">
          </label>
          <button id="exportSupplierMonthBtn" class="primary-btn" type="button">导出每家每月送货金额</button>
        </div>
      </section>

      <section id="viewData" class="view">
        <div class="section-head">
          <h2>数据管理</h2>
        </div>

        <div class="summary-grid data-grid">
          <article class="metric">
            <span>进货记录</span>
            <strong id="dataPurchaseCount">0</strong>
          </article>
          <article class="metric">
            <span>营业额记录</span>
            <strong id="dataRevenueCount">0</strong>
          </article>
          <article class="metric">
            <span>单据照片</span>
            <strong id="dataReceiptCount">0</strong>
          </article>
          <article class="metric">
            <span>估算占用</span>
            <strong id="dataStorageSize">0 KB</strong>
          </article>
        </div>

        <div class="section-head">
          <h2>备份恢复</h2>
        </div>
        <div class="form-panel action-panel">
          <button id="exportBackupPanelBtn" class="primary-btn" type="button">导出完整备份</button>
          <label class="import-box">
            <span>导入备份</span>
            <input id="importBackupInput" type="file" accept="application/json,.json">
          </label>
          <p class="help-text">导入会用备份文件覆盖当前手机里的账本数据。建议导入前先导出一次当前备份。</p>
        </div>

        <div class="section-head">
          <h2>空间清理</h2>
        </div>
        <div class="form-panel action-panel">
          <button id="clearReceiptsBtn" class="danger-btn" type="button">清理所有单据照片</button>
          <p class="help-text">只删除照片，进货记录、金额、日期、状态和备注都会保留。手机空间紧张时可以用。</p>
        </div>
      </section>
    </main>

    <nav class="bottom-nav" aria-label="主导航">
      <button class="nav-btn is-active" data-view="viewHome">登记</button>
      <button class="nav-btn" data-view="viewRecords">记录</button>
      <button class="nav-btn" data-view="viewStats">统计</button>
      <button class="nav-btn" data-view="viewData">数据</button>
    </nav>
  </div>

  <dialog id="recordDialog">
    <div class="dialog-head">
      <h2 id="dialogTitle">记录详情</h2>
      <button id="closeDialogBtn" class="icon-btn" type="button">关闭</button>
    </div>
    <div id="dialogBody"></div>
  </dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="./app.js"></script>
</body>
</html>
